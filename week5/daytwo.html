<!DOCTYPE html>
<html>
<head>
<style>
.grid-container {
  display: grid;
  grid-template-areas:
    'header header header header header header header header'
    'menu menu maina maina maina maina righta righta'
    'menu menu maina maina maina maina righta righta'
    'menu menu mainb mainb mainb mainb righta righta'
    'menu menu mainb mainb mainb mainb righta rightb'
    'menu menu mainc mainc mainc mainc righta rightb'
    'menu menu mainc mainc mainc mainc righta rightb';
  gap: 10px;
  background-color: dodgerblue;
  padding: 10px;
}

.grid-container > div {
  background-color: #f1f1f1;
  color:#000;
  padding: 10px;
  font-size: 30px;
  text-align: center;
}
.item1 { grid-area: header; }
.item2 { grid-area: menu; }
.item3 { grid-area: maina; }
.item4 { grid-area: mainb; }
.item5 { grid-area: mainc; }
.item6 { grid-area: righta; }
.item7 { grid-area: rightb; }
.item8 { grid-area: footer; }
</style>
</head>
<body>


<div class="grid-container">
  <div class="item1">Header</div>
  <div class="item2">Menu</div>
  <div class="item3">Main A</div>  
  <div class="item4">Main B</div>  
  <div class="item5">Main C</div>    
  <div class="item6">Right A</div>
    <div class="item7">Right B</div>
  <div class="item8">Footer</div>
</div>

</body>
</html>
