<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    div {
        width: 100%;
        height: 100vh;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    div > div {
        width: 50%;
        height: 50%;
        background-color: #4CAF50;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    /* 1200px and up */
    @media (min-width: 1200px) {
        div {
            background-color: #f0f0f0;
        }
        div > div {
            background-color: #4CAF50;
            width: 50%;
            height: 50%;
        }
        h1 {
        text-align: center;
        color: #ff0000;
    }
    }
    /* 800px to 1199px */
    @media (max-width: 1199px) and (min-width: 800px) {
        div {
            background-color: #e0e0ff;
        }
        div > div {
            background-color: #2196F3;
            width: 60%;
            height: 60%;
        }
                h1 {
        text-align: center;
        color: #d900ff;
    }
    }
    /* 600px to 799px */
    @media (max-width: 799px) and (min-width: 600px) {
        div {
            background-color: #fffbe0;  
        }
        div > div {
            background-color: #FF9800;
            width: 70%;
            height: 70%;
        }
        h1 {
        text-align: center;
        color: #0037ae;
    }
    }
    /* 400px to 599px */
    @media (max-width: 599px) and (min-width: 400px) {
        div {
            background-color: #ffe0e0;
        }
        div > div {
            background-color: #E91E63;
            width: 80%;
            height: 80%;
        }
        h1 {
        text-align: center;
        color: #73ff4d;
    }
    }
    /* Below 400px */
    @media (max-width: 399px) {
        div {
            background-color: #222;
        }
        div > div {
            background-color: #fff;
            width: 90%;
            height: 90%;
        }
        h1 {
        text-align: center;
        color: #770000;
    }
    }
</style>
</head>
<body>
    <h1>Header</h1>
    <div>
        <div>
            <p>Hello Division</p>
        </div>
</body>
</html>
