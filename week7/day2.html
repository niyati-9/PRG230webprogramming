<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-section Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
    }
    fieldset {
      border: 2px solid #ccc;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 20px;
    }
    legend {
      font-weight: bold;
      color: #333;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }
    button {
      background-color: #007bff;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<h2>Registration Form</h2>

<form>
  <!-- 1. General Info -->
  <fieldset>
    <legend>General Information</legend>

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" min="1900-01-01" max="2025-12-31" required>

    <label>Gender:</label>
    <select name="gender" required>
      <option value="">--Select--</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>
  </fieldset>

  <!-- 2. Address -->
  <fieldset>
    <legend>Address Information</legend>

    <label for="permAddress">Permanent Address:</label>
    <textarea id="permAddress" name="permAddress" rows="2" required></textarea>

    <label for="tempAddress">Temporary Address:</label>
    <textarea id="tempAddress" name="tempAddress" rows="2"></textarea>
  </fieldset>

  <!-- 3. Bank Info -->
  <fieldset>
    <legend>Bank Information</legend>

    <label for="bankName">Bank Name:</label>
    <input type="text" id="bankName" name="bankName" maxlength="50" required>

    <label for="accountNumber">Account Number:</label>
    <input type="text" id="accountNumber" name="accountNumber" maxlength="16" required>
  </fieldset>

  <!-- 4. Document Upload -->
  <fieldset>
    <legend>Document Upload</legend>

    <label for="photo">Upload Photo:</label>
    <input type="file" id="photo" name="photo" accept="image/*" required>

    <label for="idProof">Upload ID Proof:</label>
    <input type="file" id="idProof" name="idProof" accept=".pdf,.jpg,.jpeg,.png" required>
  </fieldset>

  <button type="submit">Submit</button>
</form>

</body>
</html>
